name: Draw today's map

on:
  schedule:
    - cron: "5 0 * * *" # daily, just after midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [assets/make_hero.py, .github/workflows/hero.yml]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install numpy scikit-image
      - run: python assets/make_hero.py --out dist

      # The images live on their own single-commit branch, so main's history stays clean.
      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Map for $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
